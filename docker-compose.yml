version: "3.8"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ghostnet_postgis
    environment:
      POSTGRES_DB: ghostnet_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ghostnet_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: ghostnet_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/ghostnet_db
      DETECTOR_BACKEND: mock
      USE_SQLITE_TEST: "False"
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./weights:/app/weights

volumes:
  pgdata:
